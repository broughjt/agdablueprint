[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agdablueprint", "agdablueprint.Packages"]

[project]
name = "agdablueprint"
version = "0.1.0"
dependencies = [
  "plasTeX >= 3.1",
  "plastexshowmore >= 0.0.2",
  "plastexdepgraph >= 0.0.4",
  "click",
  "rich",
  "rich-click",
  "tomlkit",
  "Jinja2 >= 3.1.0",
  "GitPython >= 3.1.28"
]
requires-python = ">=3.8"
authors = [
  {name="Patrick Massot"},
  {name="Peter LeFanu Lumsdaine"},
  {name="Andrej Bauer"},
  {name="Reinis Cirpons"},
  {name="Jackson Brough"}
]
maintainers = [
  {name="Jackson Brough", email="jacksontbrough@gmail.com"}
]
description = "Agda blueprint plasTeX plugin."
readme = "README.md"
keywords = ["Agda", "Agda blueprint"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]

[project.urls]
Homepage = "https://github.com/broughjt/agdablueprint"

[project.scripts]
agdablueprint = "agdablueprint.client:safe_cli"
